name: Build & Upload Artifact

on:
  push:
    tags: 
      - '*.*.*'

env:
  buildName: My-Game
  itchio_channel: windows

jobs:
  buildAndUploadArtifact:
    name: Build & upload artifact
    runs-on: windows-latest
    steps:

      # Checkouts the repository code
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Caches library folder for faster build times
      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ matrix.targetPlatform }}
          restore-keys: Library-

      # Builds the project for Windows Standalone
      - name: Build
        uses: game-ci/unity-builder@v4
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          buildName: ${{ env.buildName }}
          targetPlatform: StandaloneWindows64
          versioning: None 
      
      # Uploads the build output as a GitHub artifact
      - name: Upload Build to itch.io project
        uses: robpc/itchio-upload-action@v1
        with:
          path: build/StandaloneWindows
          project: ${{ secrets.ITCHIO_PROJECT }}
          channel: ${{ env.itchio_channel }}
          version: ${{ github.ref_name }}
          api-key: ${{ secrets.ITCHIO_API_KEY }}